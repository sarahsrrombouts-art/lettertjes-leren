# Converts facebook/wav2vec2-xlsr-53-espeak-cv-ft to a quantized ONNX
# model the app can run in the browser, split into <100MB chunks
# (GitHub's file size limit), and commits them under model/.
#
# Run it once by hand: GitHub → Actions → convert-model → Run workflow.
# Takes ~15 minutes. Afterwards the "Klankmodus" toggle in the app works.
name: convert-model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling (CPU-only torch)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "optimum[exporters]" onnx onnxruntime transformers

      - name: Export to ONNX
        run: |
          optimum-cli export onnx \
            --model facebook/wav2vec2-xlsr-53-espeak-cv-ft \
            --task automatic-speech-recognition \
            export/

      - name: Quantize, split and build manifest
        run: |
          python - <<'EOF'
          import json, math, os
          from onnxruntime.quantization import quantize_dynamic, QuantType

          os.makedirs("model", exist_ok=True)
          quantize_dynamic("export/model.onnx", "model_q8.onnx",
                           weight_type=QuantType.QInt8)

          # vocab: token->id in export/vocab.json; invert to id->token list
          with open("export/vocab.json") as f:
              tok2id = json.load(f)
          id2tok = [None] * (max(tok2id.values()) + 1)
          for tok, i in tok2id.items():
              id2tok[i] = tok
          with open("export/config.json") as f:
              blank_id = json.load(f).get("pad_token_id", 0)

          CHUNK = 90 * 1024 * 1024
          size = os.path.getsize("model_q8.onnx")
          parts = []
          with open("model_q8.onnx", "rb") as f:
              for n in range(math.ceil(size / CHUNK)):
                  name = f"model.onnx.part{n:02d}"
                  with open(f"model/{name}", "wb") as out:
                      out.write(f.read(CHUNK))
                  parts.append(name)

          with open("model/manifest.json", "w") as f:
              json.dump({"parts": parts, "totalBytes": size,
                         "vocab": id2tok, "blankId": blank_id}, f)
          print(f"quantized size: {size/1e6:.0f} MB in {len(parts)} parts")
          EOF

      - name: Commit model chunks
        run: |
          git config user.name "convert-model action"
          git config user.email "actions@github.com"
          git add model/
          git commit -m "Add quantized wav2vec2 phoneme model (built by convert-model action)"
          git push
