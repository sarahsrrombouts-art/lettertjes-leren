# Builds the browser-ready phoneme model (see scripts/convert_model.py)
# and commits the chunks under model/.
#
# Triggers: manual (Run workflow) or automatically when the conversion
# script/workflow changes. On failure it commits buildlog.txt so the
# error is readable without access to the Actions log viewer.
name: convert-model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/convert_model.py"
      - ".github/workflows/convert-model.yml"

permissions:
  contents: write

concurrency:
  group: convert-model
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling (pinned, CPU-only torch)
        run: |
          pip install --quiet torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers==4.46.3 onnx==1.17.0 onnxruntime==1.20.1 huggingface_hub numpy

      - name: Convert model
        run: |
          set -o pipefail
          python scripts/convert_model.py 2>&1 | tee buildlog.txt

      - name: Commit model chunks
        run: |
          git config user.name "convert-model action"
          git config user.email "actions@github.com"
          git add model/
          git commit -m "Add quantized wav2vec2 phoneme model (built by convert-model action)"
          git pull --rebase origin main
          git push

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "convert-model action"
          git config user.email "actions@github.com"
          git add -f buildlog.txt
          git commit -m "convert-model failed: see buildlog.txt"
          git pull --rebase origin main
          git push
